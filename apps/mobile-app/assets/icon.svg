<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bgGradient)"/>
  
  <!-- Open Bible book -->
  <g transform="translate(512, 512)">
    <!-- Left page -->
    <path d="M -180 -150 L -180 150 Q -180 170 -160 170 L -10 170 L -10 -150 Z" 
          fill="url(#bookGradient)" 
          stroke="#1E40AF" 
          stroke-width="4"/>
    
    <!-- Right page -->
    <path d="M 10 -150 L 10 170 L 160 170 Q 180 170 180 150 L 180 -150 Z" 
          fill="url(#bookGradient)" 
          stroke="#1E40AF" 
          stroke-width="4"/>
    
    <!-- Book spine shadow -->
    <rect x="-10" y="-150" width="20" height="320" fill="#1E40AF" opacity="0.3"/>
    
    <!-- Bible cross on left page -->
    <g transform="translate(-95, -50)">
      <rect x="-8" y="-40" width="16" height="100" rx="4" fill="#3B82F6"/>
      <rect x="-30" y="-20" width="60" height="16" rx="4" fill="#3B82F6"/>
    </g>
    
    <!-- Quiz lines on right page -->
    <line x1="30" y1="-100" x2="150" y2="-100" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    <line x1="30" y1="-60" x2="150" y2="-60" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    <line x1="30" y1="-20" x2="150" y2="-20" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    <line x1="30" y1="20" x2="130" y2="20" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    <line x1="30" y1="60" x2="140" y2="60" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Quiz checkmark -->
    <g transform="translate(100, 110)">
      <circle r="25" fill="#10B981"/>
      <path d="M -8 0 L -2 8 L 10 -8" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
  
  <!-- Title text at bottom -->
  <text x="512" y="900" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">
    Smart eQuiz
  </text>
</svg>

<svg width="1242" height="2688" viewBox="0 0 1242 2688" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="splashGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1242" height="2688" fill="url(#splashGradient)"/>
  
  <!-- Decorative glow effects -->
  <circle cx="621" cy="900" r="400" fill="url(#glowGradient)"/>
  
  <!-- Main app icon - larger version -->
  <g transform="translate(621, 900)">
    <!-- Open Bible book -->
    <!-- Left page -->
    <path d="M -270 -225 L -270 225 Q -270 255 -240 255 L -15 255 L -15 -225 Z" 
          fill="url(#bookGradient)" 
          stroke="#1E40AF" 
          stroke-width="6"/>
    
    <!-- Right page -->
    <path d="M 15 -225 L 15 255 L 240 255 Q 270 255 270 225 L 270 -225 Z" 
          fill="url(#bookGradient)" 
          stroke="#1E40AF" 
          stroke-width="6"/>
    
    <!-- Book spine shadow -->
    <rect x="-15" y="-225" width="30" height="480" fill="#1E40AF" opacity="0.3"/>
    
    <!-- Bible cross on left page -->
    <g transform="translate(-142, -75)">
      <rect x="-12" y="-60" width="24" height="150" rx="6" fill="#3B82F6"/>
      <rect x="-45" y="-30" width="90" height="24" rx="6" fill="#3B82F6"/>
    </g>
    
    <!-- Quiz lines on right page -->
    <line x1="45" y1="-150" x2="225" y2="-150" stroke="#3B82F6" stroke-width="9" stroke-linecap="round"/>
    <line x1="45" y1="-90" x2="225" y2="-90" stroke="#3B82F6" stroke-width="9" stroke-linecap="round"/>
    <line x1="45" y1="-30" x2="225" y2="-30" stroke="#3B82F6" stroke-width="9" stroke-linecap="round"/>
    <line x1="45" y1="30" x2="195" y2="30" stroke="#3B82F6" stroke-width="9" stroke-linecap="round"/>
    <line x1="45" y1="90" x2="210" y2="90" stroke="#3B82F6" stroke-width="9" stroke-linecap="round"/>
    
    <!-- Quiz checkmark -->
    <g transform="translate(150, 165)">
      <circle r="37" fill="#10B981"/>
      <path d="M -12 0 L -3 12 L 15 -12" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
  
  <!-- App name -->
  <text x="621" y="1450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" 
        font-size="120" font-weight="bold" fill="white" text-anchor="middle">
    Smart eQuiz
  </text>
  
  <!-- Tagline -->
  <text x="621" y="1560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" 
        font-size="48" font-weight="normal" fill="white" fill-opacity="0.9" text-anchor="middle">
    Bible Quiz Platform
  </text>
  
  <!-- Loading indicator -->
  <g transform="translate(621, 2200)">
    <!-- Loading dots animation -->
    <circle cx="-60" cy="0" r="12" fill="white" opacity="0.6"/>
    <circle cx="0" cy="0" r="12" fill="white" opacity="0.8"/>
    <circle cx="60" cy="0" r="12" fill="white" opacity="0.6"/>
  </g>
  
  <!-- Bottom decorative elements -->
  <g opacity="0.15">
    <circle cx="100" cy="2500" r="80" fill="white"/>
    <circle cx="1142" cy="2550" r="60" fill="white"/>
    <circle cx="200" cy="2600" r="40" fill="white"/>
  </g>
</svg>
